server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20M;

    # Proxy inverso hacia el backend (red interna de Docker, nunca expuesto directamente)
    location /api/ {
        proxy_pass http://constancias-api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://constancias-api:8000/admin/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fotos, firmas y fondos de plantilla (MEDIA_ROOT). Django NO sirve esto
    # con DEBUG=False (django.conf.urls.static.static() es un no-op fuera de
    # debug) -- Nginx lo sirve directo desde el volumen compartido con el
    # backend (ver docker-compose.yml, mismo MEDIA_ROOT montado read-only).
    location /media/ {
        alias /usr/share/nginx/media/;
    }

    location /static/ {
        proxy_pass http://constancias-api:8000/static/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Routing de Angular (SPA): cualquier ruta desconocida cae en index.html.
    # SIN el fallback $uri/: si algun dia una carpeta estatica (p.ej.
    # public/algo/) comparte nombre con una ruta de Angular (paso justo con
    # /plantillas -- ver public/plantillas, sin relacion con la ruta),
    # try_files la trataria como directorio real y nginx emitiria un 301 a
    # "<mismo-path>/" usando el puerto INTERNO del contenedor (8080, ver
    # `listen` arriba) en vez de dejar pasar la peticion a index.html -- el
    # navegador intenta seguir ese redirect a un puerto que no esta expuesto
    # afuera del contenedor y la app nunca carga. Sin $uri/, cualquier ruta
    # sin extension de archivo cae directo en index.html pase lo que pase.
    location / {
        try_files $uri /index.html;
    }

    gzip_static on;
}
