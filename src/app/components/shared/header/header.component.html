<ng-template #confirmActualizarDialog>
  <div class="modal-body text-center p-3">
    <i class="fas fa-arrows-rotate text-primary mb-3" style="font-size: 2.5rem;"></i>
    <p class="mb-0">
      Se va a solicitar una actualización manual del poblado de credencial.
      Este proceso puede tardar algunos minutos. ¿Deseas continuar?
    </p>
  </div>
</ng-template>

<header class="header ">
      <div class="header-content">
        <!-- Logo o título (lado izquierdo) -->
        <div class="header-left">
        <div 
          class="toolbar-toggle-btn"
          (click)="toggleSidebar()"
          [attr.aria-label]="sidebarService.isCollapsed() ? 'Abrir menú' : 'Cerrar menú'">
          <span class="toggle-icon"> <i class="fas fa-bars"></i> </span>
        </div>
        <!-- bton home -->
         <div 
          class="toolbar-toggle-btn"
          (click)="goHome()">
          <span class="toggle-icon"> <i class="fas fa-house"></i> </span>
        </div>
        <div class="text-white">Sistema de Credencialización y Enrolamiento</div>

        <!-- Fecha de ultima sincronizacion del poblado de credencial
             (sicre_tbl_sig, sync de Celery cada 30 min) -- vive aqui, en el
             header global, para que quede visible sin importar la pantalla
             en la que se esté; la conoce "Imprimir credenciales" al cargar
             el roster (ver RosterSyncService). Oculto hasta que exista un
             valor real: nadie la ha visitado todavia en esta sesion. -->
        <div class="header-sync" *ngIf="textoUltimaActualizacion">
          <span title="Última sincronización del poblado de credencial">
            <i class="fas fa-satellite-dish"></i>
            <app-split-flap-text [texto]="textoUltimaActualizacion"></app-split-flap-text>
          </span>

          <button type="button" class="header-sync-btn" (click)="abrirConfirmacionActualizar()"
                  [disabled]="actualizandoManualmente"
                  title="Actualizar el poblado de credencial ahora">
            <i class="fas fa-arrows-rotate" [class.fa-spin]="actualizandoManualmente"></i>
          </button>

          <div class="header-sync-progreso" *ngIf="actualizandoManualmente" title="Actualizando el poblado de credencial...">
            <div class="header-sync-progreso-barra"></div>
          </div>
        </div>

    </div>
        
        <!-- Elementos del usuario (lado derecho) -->
        <div class="header-right">
          <span class="username">{{ nombreUsuario }}</span>
          <div class="user-menu" (click)="toggleDropdown()">
            <!-- Ícono de usuario: foto si se pudo cruzar por numEmpleado, si no la silueta -->
            <div class="user-icon">
              <img *ngIf="usuario?.foto" [src]="usuario.foto" alt="Foto de perfil">
              <svg *ngIf="!usuario?.foto" width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
              </svg>
            </div>

            <!-- Dropdown menu -->
            <div class="dropdown-menu" [class.show]="isDropdownOpen">
              <button class="dropdown-item" (click)="logout()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.59L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/>
                </svg>
                Cerrar Sesión
              </button>
            </div>
          </div>
        </div>
      </div>
    </header>
