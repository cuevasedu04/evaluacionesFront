<div class="sidebar-container">
			<!-- Sidebar -->
				<nav class="sidebar " [class.collapsed]="sidebarService.isCollapsed()"
			 [class.mobile-visible]="sidebarService.isMobile() && sidebarService.isExpanded()">

				<div class="sidebar-empty-state" *ngIf="mostrarMensajeDashboard && sidebarService.isExpanded()">
					<p>Selecciona un bloque para acceder a los módulos del sistema.</p>
				</div>

				<!-- Menú de navegación -->
				<ul class="sidebar-menu">
					<li class="menu-item" *ngFor="let item of menuUsuario">
						<a href="#" class="menu-link" [class.active]="isActive(item)" (click)="selectItem(item, $event)">
							<span class="{{item.icon}}" [innerHTML]=""></span>
							<span class="menu-text" *ngIf="sidebarService.isExpanded()">{{ item.label }}</span>
						</a>
					</li>
				</ul>

				<footer class="sidebar-footer-docs" *ngIf="sidebarService.isExpanded()">
					<div class="footer-title">Documentos</div>
					<a class="footer-link" href="/docs/Manual%20de%20usuario_SCG_NV.pdf" target="_blank" rel="noopener noreferrer">
						<i class="fas fa-book-open"></i>
						<span>Manual</span>
					</a>
					<a class="footer-link" href="/docs/Aviso%20de%20privacidad%20SCG.pdf" target="_blank" rel="noopener noreferrer">
						<i class="fas fa-lock"></i>
						<span>Privacidad</span>
					</a>
					<a class="footer-link" href="/docs/RIANAM_2023.pdf" target="_blank" rel="noopener noreferrer">
						<i class="fas fa-balance-scale"></i>
						<span>Reglamento</span>
					</a>
				</footer>
			</nav>


			<!-- Overlay para mobile -->
			<div 
				class="sidebar-overlay" 
				*ngIf="sidebarService.isExpanded() && sidebarService.isMobile()"
				(click)="onOverlayClick()">
			</div>
</div>
